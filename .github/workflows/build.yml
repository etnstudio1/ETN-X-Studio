name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------- YEH NAYA STEP HAI (Directory check) ----------
      - name: Check Directory Structure
        run: |
          echo "Root directory:"
          ls -la
          echo "App directory:"
          ls -la app/ || echo "app folder missing!"
          echo "App src directory:"
          ls -la app/src/ || echo "src folder missing!"
          echo "Checking build.gradle.kts exists:"
          ls -la app/build.gradle.kts || echo "build.gradle.kts MISSING in app/"
      # ---------------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
